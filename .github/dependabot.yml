# Dependabot configuration (repo root)
#
# The nested gateway-node/.github/dependabot.yml is the upstream-derived
# config; this root file exists to pin down repo-wide suppression rules that
# must survive regardless of which config GitHub's Dependabot discovery
# picks up.
#
# sharp: 0.35.x ships broken prebuilt libvips binaries - decoding common PNG
# fixtures throws "vipspng: libpng read error" / "libspng read error" on both
# Windows 11 local runs and ubuntu-24.04 CI runners. 0.33.5 decodes the same
# fixtures fine everywhere. Keep 0.33.x pinned (root optionalDependencies and
# gateway-node/extensions/media-understanding-core) until upstream publishes
# fixed prebuilts. See PR #7 for the verification details.
#
# minimatch: 11 changes the pattern semantics the exec allowlist analysis
# relies on. With 11 in the tree the chained-command allowlist specs in
# gateway-node/src/infra/exec-approvals-*.test.ts report an allowlist as
# unsatisfied, so keep the 10.x line until the analysis is updated.
#
# quickjs-wasi: 3.x changes the WASM host bridge surface Code Mode's sandbox
# depends on. With 3.6.4 installed, 13 specs in
# gateway-node/src/agents/code-mode.test.ts fail (nested tool-call resume,
# wait handling, output limits, hostile-loop termination). Keep the 2.x line
# until Code Mode is ported.

version: 2

updates:
  - package-ecosystem: npm
    directory: /gateway-node
    schedule:
      interval: weekly
    ignore:
      - dependency-name: sharp
        versions: [">=0.34"]
      - dependency-name: minimatch
        versions: [">=11"]
      - dependency-name: quickjs-wasi
        versions: [">=3"]

  - package-ecosystem: npm
    directory: /gateway-node/extensions/media-understanding-core
    schedule:
      interval: weekly
    ignore:
      - dependency-name: sharp
        versions: [">=0.34"]

  - package-ecosystem: npm
    directory: /gateway-node/extensions/file-transfer
    schedule:
      interval: weekly
    ignore:
      - dependency-name: minimatch
        versions: [">=11"]
