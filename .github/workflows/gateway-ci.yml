name: Gateway Node CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'gateway-node/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gateway-node/**'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test Node Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-node
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # packageManager in gateway-node/package.json pins pnpm 11.28.10. Asking
      # action-setup for 9 made every `pnpm` call fail the version check.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.10
          cache: true
          cache_dependency_path: gateway-node/pnpm-lock.yaml
          package_json_file: gateway-node/package.json
          run_install: false

      # pnpm-lock.yaml is committed: CI installs exactly the reviewed tree
      # instead of re-resolving fresh on every run. That keeps the 48h
      # minimumReleaseAge gate (pnpm-workspace.yaml) meaningful — a fresh
      # resolution used to pick up packages published within the quarantine
      # and fail the lockfile verification in pnpm's implicit pre-script
      # install, turning main red for a day at a time until they aged out.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm build

      # Slack and WhatsApp are source-only bundled plugins (the build
      # deliberately skips their dist entry), so point the suite at the source
      # extensions tree the way a root checkout would resolve it.
      - name: Run Tests
        env:
          OPENCLAW_BUNDLED_PLUGINS_DIR: extensions
          OPENCLAW_TEST_TRUST_BUNDLED_PLUGINS_DIR: "1"
        run: pnpm test
