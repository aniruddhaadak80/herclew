name: Gateway Node CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'gateway-node/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gateway-node/**'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test Node Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-node
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # packageManager in gateway-node/package.json pins pnpm 11.28.10. Asking
      # action-setup for 9 made every `pnpm` call fail the version check.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.10
          run_install: false

      # No `cache: pnpm` here: pnpm-lock.yaml is gitignored in this repo, so
      # the cache action would fail on a path that never exists.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Run Build
        run: pnpm build

      # Slack and WhatsApp are source-only bundled plugins (the build
      # deliberately skips their dist entry), so point the suite at the source
      # extensions tree the way a root checkout would resolve it.
      - name: Run Tests
        env:
          OPENCLAW_BUNDLED_PLUGINS_DIR: extensions
          OPENCLAW_TEST_TRUST_BUNDLED_PLUGINS_DIR: "1"
        run: pnpm test
