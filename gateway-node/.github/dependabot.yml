# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

registries:
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{secrets.NPM_NPMJS_TOKEN}}
    replaces-base: true

updates:
  # npm dependencies (root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    # sharp >= 0.34 ships broken prebuilt libvips binaries (vipspng/libspng
    # "read error" decoding common PNG fixtures, verified on Windows 11 and
    # ubuntu-24.04). Keep 0.33.x until upstream publishes working prebuilts.
    ignore:
      - dependency-name: sharp
        versions: [">=0.34"]
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 20
    registries:
      - npm-npmjs

  # npm dependencies - media-understanding-core extension
  - package-ecosystem: npm
    directory: /extensions/media-understanding-core
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    # Same sharp prebuilt-binary breakage as above; keep the 0.33.5 pin.
    ignore:
      - dependency-name: sharp
        versions: [">=0.34"]
    open-pull-requests-limit: 5
    registries:
      - npm-npmjs

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Swift Package Manager - macOS app
  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      swift-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Swift Package Manager - shared MoltbotKit
  - package-ecosystem: swift
    directory: /apps/shared/MoltbotKit
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      swift-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Swift Package Manager - Swabble
  - package-ecosystem: swift
    directory: /apps/swabble
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      swift-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Gradle - Android app
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      android-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      docker-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
